name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, claude/vibrant-clarke-y6qm5s]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Admin saves can come in quick succession; only the newest one needs to deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check datasets.json
        run: node scripts/validate-datasets.js
      # Pages lets browsers cache files for 10 minutes. Tag script and style
      # URLs with the commit, so a reloaded page never runs last deploy's JS.
      - name: Version asset URLs
        run: sed -i -E "s#(assets/(js|css)/[a-z]+\.(js|css))\"#\1?v=${GITHUB_SHA::8}\"#g" public/*.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
